# PR-Checks (Teil der Pflicht-Checks, siehe docs/github-konzept.md Abschnitt 5)
# Weitere PR-Prüfungen (Integrationstests, Docker-Build + Trivy, Dependency-Review) ergänzt DevOps hier.
name: pr-checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      - name: pre-commit (alle Dateien)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks über gesamte Git-Historie
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact -v

  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: PR-Titel nach Conventional Commits (bestimmt die Version)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            ci
            perf

  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Nach main nur PRs aus dev
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::PRs nach main sind nur aus dev erlaubt (Quell-Branch: $HEAD)"
            exit 1
          fi
          echo "OK: $HEAD -> $BASE"
